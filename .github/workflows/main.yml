name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK nomini o'zgartirish
        run: |
          NAME=$(grep '^APP_NAME=' gradle.properties | cut -d= -f2- | tr -d '\r' | tr ' ' '_')
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/${NAME}.apk"
          echo "APK_NAME=${NAME}" >> $GITHUB_ENV

      - name: APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: out/*.apk

      - name: Releases'ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ env.APK_NAME }} v1.0.${{ github.run_number }}
          body: Telefoningizga pastdagi .apk faylni yuklab oling va o'rnating.
          files: out/*.apk
